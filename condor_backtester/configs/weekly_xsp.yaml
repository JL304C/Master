# Settings for the weekly order helper: python -m condor_bt.weekly plan
# Prices and widths are native XSP (0.15 = $15 per contract; 1 XSP point = 10 SPX points).
symbol: XSP
target_dte: 90
dte_tolerance: 14       # monthly XSP expirations are ~4-5 weeks apart; 14 keeps one in range
debit_delta: 0.20
debit_width: 5          # buy ~20-delta, sell 5 below (5/20 fits $5 monthly strikes and $1 quarter-ends)
credit_delta: 0.10
credit_width: 20        # sell ~10-delta, buy 20 below
min_credit: 0.20        # skip the week below this mid credit (fees are ~$2.64); also the ladder floor
ladder_steps: 3         # suggested limit prices: mid, mid-0.01, ... (never below min_credit)
contracts: 1
fee_per_contract: 0.66  # Schwab $0.65 + ~$0.01 regulatory, per leg
max_open_positions: 13
max_total_risk: 5000    # dollars of max loss across open positions (about 3 condors at 5/20)
journal: journal/xsp_journal.csv
risk_free_rate: 0.04
div_yield: 0.013
source: auto            # auto | yahoo | schwab
