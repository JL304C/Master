# Contrarian short-selling bot. Values marked [DEFAULT] in STRATEGY_SPEC.md are
# starting points to test, not settled facts.

account:
  equity: 1000000            # Alpaca paper account #3

data:
  cache_dir: cache
  # Nasdaq-exchange trades (TotalView-ITCH), 1-minute bars from 2018-05 incl. premarket.
  # About 20% of total volume: prices, VWAP and volume *ratios* track the full tape;
  # absolute share counts are scaled by each stock's Nasdaq share (below).
  # Daily bars for the level library are built from the same data.
  # (EQUS.MINI was tried first: it holds only ~3% of volume and almost no premarket.)
  intraday_dataset: XNAS.ITCH
  intraday_start: "2018-05-01"
  daily_dataset: XNAS.ITCH
  daily_start: "2018-05-01"
  # Official consolidated daily bars (from 2024-07), only to measure Nasdaq's share of volume.
  summary_dataset: EQUS.SUMMARY
  summary_start: "2024-07-01"
  default_nasdaq_share: 0.2
  # Live session bars: Alpaca SIP stream (Algo Trader Plus). Subscribing to bars for
  # "*" gives every US stock, which the Contra / relative-weakness scanners need.
  live_feed: alpaca_sip
  index_proxies: {SPY: 1.0, QQQ: 1.0, IWM: 0.5, DIA: 0.5}
  extra_symbols: [SMH]
  # Ticker changes: the old ticker is used for dates before `until`.
  symbol_history:
    META: [{symbol: FB, until: "2022-06-09"}]

levels:
  lookback_days: 500
  atr_period: 14
  pivot:
    swing_bars: 3              # swing high/low = beyond 3 bars on each side
    cluster_atr: 0.35          # a zone takes the swing points within 0.35 x ATRd of its centre
    min_touches: 3
    min_span_days: 10
    zone_pad_atr: 0.10
    max_days_outside: 2        # closes beyond the zone for more than 2 days -> flips role
    high_volume_mult: 1.5      # touch-day volume >= 1.5 x 50-day average earns a bonus
    consolidation_days: 3      # closes at the end of a run of >= 3 tight days are candidates
    consolidation_atr: 0.5     # "tight" = the run's close range <= 0.5 x ATRd
    min_excursion_atr: 1.5     # price must move 1.5 x ATRd away between touches [ADDED]
    suppress_atr: 1.5          # only the strongest pivot within 1.5 x ATRd is kept [ADDED]
  swing:                       # major zigzag swings as levels, even with 1-2 touches [ADDED]
    strength: 2                # per swing; a double top at the same price = 4
    twin_atr: 0.25             # two major swings within 0.25 x ATRd = double top/bottom
    zone_atr: 0.15
  trendline:
    zigzag_atr: 3.0            # major swings need a >= 3 x ATRd reversal
    touch_atr: 0.25            # third touch within 0.25 x ATRd validates the line
    zone_atr: 0.15
    broken_days: 2             # rising support closed below for 2+ days = broken
    broken_retest_days: 60     # a broken support line is only a retest level for 60 sessions [ADDED]
    max_age_days: 250          # ignore lines whose second anchor is older than this
  gap:
    min_atr: 2.0
    min_pct: 0.04
    zone_atr: 0.15
  ma:
    sma: [50, 100, 200]
    ema: [20]
    zone_atr: 0.10
    pivot_overlap_bonus: 2
  psych:
    zone_atr: 0.10
    strength: 1
    confluence_bonus: 1
  manual_strength: 5
  merge_atr: 0.5               # zones closer than 0.5 x ATRd merge
  merge_max_width_atr: 0.6     # ...but a merged zone stays <= 0.6 x ATRd wide [ADDED; was 1.0, too wide to trade from]
  max_open_above_atr: 3.0      # skip a level if today's open is > 3 x ATRd above it

selection:
  # 6.1 market tone
  tone:
    premarket_from: "08:00"
    final_at: "09:25"
    gap_atr: 0.3               # proxy gap beyond +-0.3 x ATRd scores +-1
    trend_points: 0.5          # premarket last vs premarket VWAP scores +-0.5
    labels: {weak: -0.75, soft: -0.25, firm: 0.25, strong: 0.75}   # NEUTRAL in between
    live_every_min: 5
  # Tone -> what each strategy group may do (spec 6.1 table). Every cell is a test.
  tone_policy:
    WEAK:    {fade: true,  fade_min_strength_pct: 0,  fade_needs_climax: false, trend: true,  trend_needs_rel_weak: false, size: 1.0}
    SOFT:    {fade: true,  fade_min_strength_pct: 0,  fade_needs_climax: false, trend: true,  trend_needs_rel_weak: false, size: 1.0}
    NEUTRAL: {fade: true,  fade_min_strength_pct: 0,  fade_needs_climax: false, trend: true,  trend_needs_rel_weak: true,  size: 1.0}
    FIRM:    {fade: true,  fade_min_strength_pct: 70, fade_needs_climax: false, trend: false, trend_needs_rel_weak: false, size: 0.5}
    STRONG:  {fade: true,  fade_min_strength_pct: 90, fade_needs_climax: true,  trend: false, trend_needs_rel_weak: false, size: 0.5}

  # 6.2 scanners. Share-count thresholds are for the full tape; they are scaled by
  # each stock's Nasdaq share of volume before use.
  premarket:
    from: "04:00"
    move_pct: 0.035            # Bid Up / Ask Down 3.5%
    min_volume: 10000
    new_high_lookback_min: 5   # "new premarket high" = made in the last 5 minutes
  gap_static_pct: 0.01         # Gap Up/Down Static: open/prior close >= 1.01 (or <= 0.99) and beyond prior high/low
  contra:
    trigger: new_day_high      # new_day_high | new_5m_high
    mode: normalized           # dollar | normalized | both
    dollar_tiers: [1.0, 2.0, 3.0]
    atr5_tiers: [1.5, 2.5, 3.5]
    min_pct_of_price: 0.01
    min_rvol: 1.5
    start: "09:31"
    requires_level: true
    level_atr5: 1.0            # a level within 1 x ATR5 above counts
  quickstrike:
    bb_period: 20
    bb_k: 2.0
    dollar_sma_dif: 0.50
    sma_dif_atr1: 1.0          # normalized version of the $0.50
    vol5_mult: 1.5
    normalized: true
  sp_top_reversal: {rsi: 90, vol5_mult: 2.0, ema20_dist_atr1: 1.5}
  para_up: {bars: 4, move_atr1: 3.0}
  cons_up_bars: 5
  rel_weak: {vs_spy_pct: -0.02, min_rvol: 1.5}
  level_proximity_atr: 2.0     # within 2 x ATRd below an active resistance
  rvol_lookback_days: 20

  # 6.4 Daily Watchlist
  watchlist:
    size: 20
    max_streamed: 40
    focus_count: 5
    focus_bonus: 3
    focus_resistance_atr: 1.0
    drop_after_idle_min: 60

# Section 4: the Rejection Engine shared by A, B, C (and A0). [DEFAULT] unless noted.
engine:
  armed_atr5: 1.0              # ARMED: price within 1 x ATR5 below the zone
  extension:
    speed_atr5: 2.0            # climbed >= 2 x ATR5 ...
    speed_minutes: 15          # ... within the last 15 minutes
    open_minutes: 30           # or spiked into the zone in the first 30 minutes
    wide_body_mult: 1.5        # or >= 2 consecutive 1m bodies >= 1.5 x the session's average body
    wide_body_bars: 2
    lookback_bars: 5           # the wide bodies must be among the last 5 bars
  max_bars_outside: 3          # closes beyond the zone top for more than 3 bars = level failed
  rejection_close_frac: 0.5    # rejection bar closes in its lower half
  min_zone_reach: 0.5          # the spike must reach at least the zone's midpoint [ADDED]
  leave_zone_atr5: 0.5         # a test ends when price closes 0.5 x ATR5 below the zone
  stops_going_up_run: 3        # FOCUS trigger: first red bar without a higher high after >= 3 higher highs
  entry_valid_bars: 3          # Entry 1 sell-stop lives 3 one-minute bars
  scenario_b: {atr1: 0.5, pct: 0.001}   # initial stop = spike high + max(0.5 x ATR1, 0.1%)
  scenario_c_atr1: 0.25        # after the add: lower high + 0.25 x ATR1
  add_valid_bars: 5            # Entry 2 sell-stop lives 5 bars [ADDED]
  confirm_window_bars: 20      # confirmed_only: the lower high must come within 20 bars of the rejection [ADDED]
  max_attempts: 2              # first test + second test, never a third
  focus_timeout_min: 30
  focus_vdif_tolerance_atr5: 0.5   # FOCUS ends when Vdif falls 0.5 x ATR5 below its start [ADDED: stops flapping]
  booster_window_bars: 5       # boosters count if seen within the last 5 bars of the test

strategies:
  enabled: [A, B, C, D, A0]    # A0 = Contra exhaustion with no level, for comparison
  entry_mode: {A: scaled, B: confirmed_only, C: scaled, A0: scaled}   # scaled | confirmed_only | aggressive_only
  A: {min_strength: 3}
  B: {speed_atr5: 1.5}
  D:
    drop_atr5: 3.0             # initial move: >= 3 x ATR5 down from the session high (or prior close) ...
    min_rvol: 2.0              # ... on RVOL >= 2, or a Trendsell trigger
    lower_highs: 2             # 5m downtrend: >= 2 lower highs, below a falling EMA20
    ema_slope_bars: 3
    ema_zone_atr5: 0.15        # pullback: 5m high reaches EMA20 - 0.15 x ATR5, closes below EMA20
    stop_atr5: 0.25            # stop = pullback high + 0.25 x ATR5
    entry_valid_bars: 5
    max_entries: 3
  boosters: {volume_climax: 1, volume_ramp: 1, body_constriction: 1, contra_tier: 1, quickstrike: 2,
             sp_top_reversal: 1, gap_reversal: 1}

# Section 8 (sizing only for now; limits and kill switch come with the Trade Manager).
risk:
  risk_per_trade: 0.005        # planned risk for the full position, entry to stop
  max_notional: 0.20

session:
  first_entry: "09:31"
  last_entry: "15:30"
  flatten: "15:55"
